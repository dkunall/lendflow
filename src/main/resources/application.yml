spring:
  application:
    name: lendflow
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LENDFLOW_DB_URL:jdbc:postgresql://localhost:55790/lendflow}
    username: ${LENDFLOW_DB_USER:lendflow}
    password: ${LENDFLOW_DB_PASSWORD:lendflow}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
      connection-init-sql: SET lock_timeout = '3s'
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${LENDFLOW_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${LENDFLOW_JWT_ISSUER:http://localhost:7991/lendflow}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  task:
    scheduling:
      pool:
        size: 4

server:
  port: ${PORT:7990}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

lendflow:
  outbox:
    batch-size: 100
    retention: P7D
  crypto:
    # No defaults on purpose: the app refuses to start without keys. Both are base64 of 32 random bytes.
    data-key: ${LENDFLOW_DATA_KEY}
    lookup-key: ${LENDFLOW_LOOKUP_KEY}
  bureau:
    url: ${LENDFLOW_BUREAU_URL:http://localhost:7992}
    timeout: 3s
    retry:
      max-attempts: 3
      first-wait: 200ms
    breaker:
      window: 20
      minimum-calls: 10
      failure-rate: 50
      open-for: 30s
    max-concurrent: 8
    max-wait-for-slot: 1s
  kyc:
    # The mock serves PAN verification and credit reports from one process; in production they are separate
    # providers, which is why the URLs are separate settings.
    registry-url: ${LENDFLOW_PAN_REGISTRY_URL:${lendflow.bureau.url}}
    timeout: 2s
    name-pass: 0.85
    name-refer: 0.70
  documents:
    max-size: 2MB
  workflow:
    poll-ms: 500
    batch-size: 8
    lease: 60s
    max-attempts: 4
    first-backoff: 2s
    max-backoff: 60s
  offers:
    gst-percent: 18
    personal:
      minimum-fee: 1000
      valid-for: 7d
    home:
      fee-cap: 25000
      valid-for: 30d
  underwriting:
    maker-sla: 4h
    checker-sla: 2h
    sweep-ms: 60000
    sweep-batch: 50
    manager-limit:
      personal: 1500000
      home: 10000000
  dedupe:
    name-threshold: 0.92
    lookback: P180D
